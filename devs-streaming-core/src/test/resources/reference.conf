pekko {
  log-level = "DEBUG"
  actor {
    // serialize-messages = on
    debug {
      unhandled = on
      event-stream = on
    }
    serializers {
      jackson-json = "org.apache.pekko.serialization.jackson.JacksonJsonSerializer"
    }
    serialization-bindings {
      "devs.iso.DevsMessage" = "jackson-json"
      "devs.iso.time.SimTime" = "jackson-json"
    }
  }
  serialization.jackson {
    jackson-json {
      serialization-features {
        INDENT_OUTPUT = on
      }
    }
    jackson-modules += "com.fasterxml.jackson.datatype.jdk8.Jdk8Module"
    jackson-modules += "com.fasterxml.jackson.datatype.guava.GuavaModule"
  }
  # ActorSystem.terminate() runs Coordinated Shutdown. If terminate-system is selected,
  # completion exits the process with a failure status. Tests override exit-jvm to off.
  coordinated-shutdown {
    run-by-actor-system-terminate = on
    exit-jvm = off
    exit-code = 1
  }
}

# Applications can override this single framework-wide setting.
devs.actor-failure-policy = "stop-actor"



